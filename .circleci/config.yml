---
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.11
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-ruby3.3-bundle-{{ checksum "Gemfile.lock" }}
      - run:
          name: Configure Bundler # use bundler version in Gemfile.lock
          command: |
            BUNDLER_VERSION=$(tail -1 Gemfile.lock | tr -d " ")
            gem install bundler -v "$BUNDLER_VERSION"
      - run:
          name: bundle install
          command: bundle install --path vendor/bundle
          no_output_timeout: 20m
      - save_cache:
          key: v2-ruby3.3-bundle-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run: JEKYLL_ENV=production make build
      - run: make serve &
      - run: make test
      - persist_to_workspace:
          root: .
          paths:
            - _site

  deploy:
    docker:
      - image: cimg/python:3.12
    environment: AWS_DEFAULT_REGION=us-west-2
    steps:
      - checkout
      - attach_workspace:
          at: .
      # certifi pin: GHSA-6q48-6c7w-9gw2 (emSign roots removed; GitHub lists 2026.10.19 as first patched)
      - run: pip install --user --upgrade awscli "certifi>=2026.10.19"
      - run: /home/circleci/.local/bin/aws s3 sync _site s3://beta.aws.openoakland.org/

workflows:
  version: 2
  commit:
    jobs: &build_and_deploy_jobs
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main

  nightly_build:
    jobs: *build_and_deploy_jobs
    triggers:
      - schedule:
          # 13:00 UTC = 6:00 AM PDT
          cron: "0 13 * * *"
          filters:
            branches:
              only:
                - main
