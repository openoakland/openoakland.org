# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: OpenOakland
email: steering@openoakland.org
description: >- # this means to ignore newlines until "baseurl:"
  OpenOakland is a Code for America Brigade serving Oakland, California.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: openoakland
github_username: openoakland

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-get-json
  - jekyll-paginate-v2

# Blog pagination. Individual pages opt in via `pagination: enabled: true`
# in their front matter (currently just src/blog.md).
pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  # jekyll-seo-tag already prefixes paginated titles with "Page N of M for",
  # so keep the page's own title unchanged to avoid a doubled-up <title>.
  title: ':title'
  sort_field: 'date'
  sort_reverse: true
  trail:
    before: 2
    after: 2

source: src
header_pages:
  - volunteer.md
  - projects.md
  - calendar/calendar.md
  - about-us.md
  - donate.md

# Nav tabs that open a dropdown instead of linking straight to their own page.
# Keyed by the same file path listed in header_pages above.
header_dropdowns:
  volunteer.md:
    title: Get Involved
    items:
      - title: Volunteer
        url: /volunteer/
      - title: Partner with Us
        url: /partner/
  projects.md:
    title: Projects
    items:
      - title: Current Projects
        url: /projects/
      - title: Impact
        url: /impact/
  calendar/calendar.md:
    title: Events
    items:
      - title: Calendar
        url: /calendar/
      - title: Blog
        url: /blog/
  about-us.md:
    title: About
    items:
      - title: About OpenOakland
        url: /about-us/
      - title: Contact Us
        url: /contact/

google_analytics: UA-35908939-6

permalink: pretty
# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
jekyll_get_json:
  - data: upcoming
    json: 'https://api.meetup.com/OpenOakland/events?&page=2'

exclude:
  - .jekyll-cache
