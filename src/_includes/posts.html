{% for post in site.posts %}


<h2><span class="blog-date">{{ post.date | date: '%B %-d, %Y' }}<br/></span><a href="{{ post.url }}">{{ post.title }}</a></h2>
{% if post.tags.size > 0 %}
<p>{% for tag in post.tags %}<span class="badge badge-secondary post-tag">{{ tag }}</span> {% endfor %}</p>
{% endif %}
<p>{{ post.post-excerpt }}</p>

{% endfor %}
