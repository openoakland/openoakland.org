<section class="pb-4 pt-4 bg-lighter-green">
  <div class="container">
    <h2 class="mt-0 text-center">Latest Blog Posts</h2>

    <div class="row">
      {% for post in site.posts limit:3 %}
      <div class="col">
        <div class="card" style="margin-top:20px;">

          <div class="card-header">{{ post.date | date_to_string: "ordinal", "US" }}</div>

          {% if post.feat-img %}<img src="{{ post.feat-img }}" class="card-img-top" alt="{{ post.feat-img-alt }}">{%
          endif
          %}

          <div class="card-body">
            <h3 class="card-title"><a href="{{ BASE_PATH }}{{ post.url }}">{{ post.title }}</a></h3>
            <p class="card-text home-excerpt">{{ post.post-excerpt }}</p>
            <a href="{{ post.url }}" class="btn btn-primary">Continue reading...</a>
          </div>

        </div>
      </div>
      {% endfor %}
    </div>

    <div>
      <div class="d-grid gap-2 d-md-flex justify-content-md-end spacer-top">
        <a href="/blog" class="btn btn-outline-secondary bg-white">View All Blog Posts</a>
      </div>
    </div>
  </div>
</section>
