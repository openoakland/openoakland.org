<header class="site-header">

  <nav class="navbar navbar-expand-lg navbar-light justify-content-between">
    <a class="navbar-brand" rel="author" href="{{ "/" | relative_url }}">
      <img src="/assets/images/OpenOakland-logo.png" class="header-logo" alt="OpenOakland Logo">
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse header-links" id="navbarSupportedContent">
      {%- if site.header_pages -%}
        {%- for path in site.header_pages -%}
          {%- assign my_page = site.pages | where: "path", path | first -%}
          {%- assign title = my_page.nav_title | default: my_page.title -%}
          {%- if title -%}
          <div class="navbar-nav mr-auto">
              <a class="nav-link nav-item {% if my_page.url == page.url %}active{% endif %}" href="{{ my_page.url | relative_url }}">{{ title | escape }}</a>
          </div>
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
    </div>
  </nav>

</header>
