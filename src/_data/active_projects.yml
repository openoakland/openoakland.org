  name: Open Disclosure Oakland
  description: Open Disclosure helps Oaklanders understand the role of money in their local politics. By analyzing mandatory campaign finance disclosures for candidates seeking public office, Open Disclosure presents a user-friendly overview of who is raising money, from where, and how much. Open Disclosure is developed in partnership with the City of Oakland Public Ethics Commission. Open Disclosure has been supporting residents since 2014, and is currently being updated to reflect 2026 data.
